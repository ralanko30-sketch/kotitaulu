<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treenisivu">
<title>Treenisivu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="wrap hidden">
  <div class="login card">
    <div class="brand" style="margin-bottom:8px"><span class="dot"></span>Treenisivu</div>
    <label class="f" for="pw">Salasana</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label class="row small" style="margin-top:12px;gap:10px;flex-wrap:nowrap"><input type="checkbox" id="rememberLogin"> Muista minut tällä laitteella</label>
    <div style="margin-top:12px"><button class="btn" id="loginBtn" style="width:100%">Kirjaudu</button></div>
    <p id="loginErr" class="small" style="color:var(--bad)"></p>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="dot"></span>Treenisivu</div>
      <div class="spacer"></div>
      <div class="sync-info" id="syncInfo"></div>
      <button class="btn sm" id="syncBtn" title="Hae uudet tiedot Garminilta">Päivitä</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on">Tänään</button>
      <button data-tab="sports">Treenit</button>
      <button data-tab="progress">Kehitys</button>
      <button data-tab="calendar">Kalenteri</button>
      <button data-tab="settings">Asetukset</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="tab-today"></section>
    <section id="tab-sports" class="hidden"></section>
    <section id="tab-progress" class="hidden"></section>
    <section id="tab-calendar" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
